<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header>
      <nav aria-label="Navigation principale">
        <span>Pay My Buddy</span>
        <div class="nav-links">
          <a th:href="@{/transfer}">Transférer</a>
          <a th:href="@{/profile}" aria-current="page">Profil</a>
          <a th:href="@{/add-connection}">Ajouter relation</a>
          <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
          </form>
        </div>
      </nav>
    </header>
    <main>
      <section class="profile-section" aria-label="Informations du profil">
        <div class="profile-row">
          <span class="profile-label">Username</span>
          <span class="profile-value" th:text="${user.username}">
            @username
          </span>
          <span class="profile-arrow" aria-hidden="true">›</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Mail</span>
          <span class="profile-value" th:text="${user.email}">
            nom@domain.com
          </span>
          <span class="profile-arrow" aria-hidden="true">›</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Mot de passe</span>
          <span class="profile-value">••••••••</span>
          <span class="profile-arrow" aria-hidden="true">›</span>
          <button type="button" class="profile-button">Modifier</button>
        </div>
      </section>
    </main>
  </body>
</html>
