<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfert</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header>
      <nav aria-label="Navigation principale">
        <span>Pay My Buddy</span>
        <div class="nav-links">
          <a th:href="@{/transfer}" aria-current="page">Transférer</a>
          <a th:href="@{/profile}">Profil</a>
          <a th:href="@{/add-connection}">Ajouter relation</a>
          <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
          </form>
        </div>
      </nav>
    </header>
    <main>
      <section class="transfer-section">
        <p
          th:if="${error}"
          th:text="${error}"
          class="error"
          role="alert"
          aria-live="polite"
        ></p>

        <form id="transferForm" th:action="@{/transfer}" method="post">
          <label class="sr-only" for="receiverEmail"
            >Sélectionner une relation</label
          >
          <select id="receiverEmail" name="receiverEmail" aria-required="true">
            <option value="">Sélectionner une relation</option>
            <option
              th:each="connection : ${user.connections}"
              th:value="${connection.email}"
              th:text="${connection.username}"
            ></option>
          </select>

          <label class="sr-only" for="description">Description</label>
          <input
            type="text"
            id="description"
            name="description"
            placeholder="Description"
          />

          <label class="sr-only" for="amount">Montant</label>
          <input
            type="number"
            id="amount"
            name="amount"
            placeholder="0€"
            min="0.01"
            step="0.01"
            aria-required="true"
          />

          <button type="submit">Payer</button>
        </form>

        <div class="transaction-table">
          <h2>Mes Transactions</h2>
          <table aria-label="Historique des transactions">
            <thead>
              <tr>
                <th scope="col">Relations</th>
                <th scope="col">Description</th>
                <th scope="col">Montant</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="transaction : ${transactions}">
                <td th:text="${transaction.receiver.username}"></td>
                <td th:text="${transaction.description}"></td>
                <td th:text="${transaction.amount} + '€'"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
