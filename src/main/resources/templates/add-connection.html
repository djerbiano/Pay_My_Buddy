<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter une relation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header>
      <nav aria-label="Navigation principale">
        <span>Pay My Buddy</span>
        <div class="nav-links">
          <a th:href="@{/transfer}">Transférer</a>
          <a th:href="@{/profile}">Profil</a>
          <a th:href="@{/add-connection}" aria-current="page"
            >Ajouter relation</a
          >
          <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
          </form>
        </div>
      </nav>
    </header>
    <main>
      <section class="add-connection-section">
        <p
          th:if="${error}"
          th:text="${error}"
          class="error"
          role="alert"
          aria-live="polite"
        ></p>

        <form th:action="@{/add-connection}" method="post">
          <label for="connectionEmail">Chercher une relation</label>
          <div class="inputBtnContainer">
            <input
              type="email"
              id="connectionEmail"
              name="connectionEmail"
              placeholder="Saisir une adresse mail"
              required
              aria-required="true"
            />
            <button type="submit">Ajouter</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
